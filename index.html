<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 検索避け -->
    <meta name="robots" content="noindex, nofollow">
    <title>活動カウンター</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .counter-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .counter-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .counter-label {
            font-size: 1.1rem;
            font-weight: bold;
            flex: 1; 
            padding-right: 10px;
            word-wrap: break-word;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        button {
            width: 45px;
            height: 45px;
            font-size: 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-minus {
            background-color: #ff4d4f;
            color: white;
        }
        .btn-minus:active { background-color: #d9363e; }
        
        .btn-plus {
            background-color: #1890ff;
            color: white;
        }
        .btn-plus:active { background-color: #096dd9; }
        
        .count-display {
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }
        
        /* リセットボタン用のデザイン */
        .reset-container {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 20px;
        }
        .btn-reset {
            width: auto;
            height: auto;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #6c757d;
            color: white;
            border-radius: 8px;
        }
        .btn-reset:active { background-color: #5a6268; }
    </style>
</head>
<body>

    <h1>活動カウンター</h1>

    <div class="counter-container" id="counters">
        <!-- JavaScriptでここにカウンターを生成します -->
    </div>

    <!-- 全てリセットするボタン -->
    <div class="reset-container">
        <button class="btn-reset" onclick="resetCounts()">全て0にリセット</button>
    </div>

    <script>
        // カウンターのラベル
        const LABELS = [
            "food",
            "drink",
            "souvenir",
            "short activity",
            "photo spot",
            "other"
        ];
        
        const container = document.getElementById('counters');

        // ★追加機能：スマホ（ブラウザ）のLocalStorageから保存されたデータを読み込む
        // データがない場合は0の配列を作る
        const savedData = localStorage.getItem('myCounterData');
        let counts = savedData ? JSON.parse(savedData) : Array(LABELS.length).fill(0);

        // カウンターのUIを生成
        for (let i = 0; i < LABELS.length; i++) {
            const card = document.createElement('div');
            card.className = 'counter-card';
            
            card.innerHTML = `
                <div class="counter-label">${LABELS[i]}</div>
                <div class="controls">
                    <button class="btn-minus" onclick="updateCount(${i}, -1)">-</button>
                    <!-- 読み込んだ数値を初期表示する -->
                    <div class="count-display" id="count-${i}">${counts[i]}</div>
                    <button class="btn-plus" onclick="updateCount(${i}, 1)">+</button>
                </div>
            `;
            container.appendChild(card);
        }

        // カウントを更新する関数
        function updateCount(index, change) {
            counts[index] += change;
            
            // マイナスにならないようにする
            if (counts[index] < 0) counts[index] = 0; 
            
            // 画面の表示を更新
            document.getElementById(`count-${index}`).innerText = counts[index];
            
            // ★追加機能：数値が変わるたびにブラウザ（LocalStorage）に保存する
            localStorage.setItem('myCounterData', JSON.stringify(counts));
        }

        // ★追加機能：全てをリセットする関数
        function resetCounts() {
            // 間違えて押さないように確認メッセージを出す
            if (confirm("すべてのカウントを「0」にリセットしますか？")) {
                // 配列をすべて0にする
                counts = Array(LABELS.length).fill(0);
                
                // ブラウザの保存データを削除
                localStorage.removeItem('myCounterData');
                
                // 画面の表示をすべて0に更新
                for (let i = 0; i < LABELS.length; i++) {
                    document.getElementById(`count-${i}`).innerText = 0;
                }
            }
        }
    </script>
</body>
</html>
